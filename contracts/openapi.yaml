          minItems: 29
          uniqueItems: true
          description: requiredの9件、recommendedの20件をdisplay_order昇順で返す。
          maxItems: 29
    dietary_master_item:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - display_name
      properties:
        id:
          $ref: "#/components/schemas/dietary_restriction_id"
        code:
          type: string
          enum:
            - vegan
            - vegetarian
            - halal
            - no_alcohol
        name:
          type: string
        display_name:
          type: string
      description: 食事制限マスタ。API 13の形式に従いname_enフィールドは返さない。確認条件はdocs/database.md。
    dietary_restrictions_response:
      type: object
