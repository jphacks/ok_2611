  /menus/analyze:
    post:
      operationId: analyze_menu
      summary: 画像解析・メニュー保存・予測
      description: アカウントBearerは任意。なしなら所有者NULL・利用者同意false。送信されたJWTは署名・期限・typ・所有者の存在を検証し、不正なら401（ゲストへ降格しない）。所有者と登録時同意はサーバー側で決め、本文の指定を拒否する。画像検証→Place
        ID確認→Gemini解析・出力検証→非公開Storage保存→解析結果の原子的保存→予測。選択設定は保存せずVLMにも渡さない。店舗ありなら同じ料理・項目の非公開回答も予測に集計する。DB失敗時は画像を削除。自動再送しない。IP単位5回/分・50回/日（初期案）。
      tags:
        - P0
      x-api-number: 4
      x-priority: P0
      security:
        - {}
        - account_bearer: []
      requestBody:
        required: true
        description: 画像1枚と任意の店舗・対象ID・locale。配列は同じフィールド名のpartを繰り返す（allergen_ids=4、allergen_ids=6）。JSON配列文字列やカンマ区切りpartは受け付けない。
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/analyze_request"
            encoding:
              image:
                contentType: image/jpeg, image/png
              allergen_ids:
                style: form
                explode: true
              dietary_restriction_ids:
                style: form
                explode: true
              google_place_id:
                contentType: text/plain
              locale:
                contentType: text/plain
      responses:
        "201":
          description: 作成成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyze_response"
              example:
                menu_id: 22222222-2222-4222-8222-222222222222
                google_place_id: ChIJN1t_tDeuEmsRUsoyG83frY4
                analysis_token: <解析用トークン（この応答でだけ返す）>
                analysis_expires_at: 2026-10-18T03:00:00Z
                ai_model: gemini-3.8-flash
                prompt_version: v4
                analyzed_at: 2026-10-17T03:00:00Z
                locale: en
                dishes:
                  - dish_id: 33333333-3333-4333-8333-333333333331
                    dish_version: 1
                    name: 海老天そば
                    display_name: Shrimp tempura soba
                    description: Buckwheat noodles in hot broth topped with shrimp tempura.
                    price: 1200
                    currency: JPY
                    allergens:
                      - allergen_id: 4
                        display_name: Shrimp
                        prediction:
                          status: contains
                          basis: ai_and_store_answers
                          vote_shares:
                            contains: 1
                            cross_contact: 0
                            not_contains: 0
                        ai:
                          status: explicit_present
                          source: menu_text
                          evidence: 海老天
                        store_history:
                          answer_counts:
                            contains: 2
                            cross_contact: 0
                            not_contains: 0
                            unknown: 0
                          last_confirmed_at: 2026-10-10T05:00:00Z
                          has_conflict: false
                      - allergen_id: 6
                        display_name: Buckwheat
                        prediction:
                          status: possible
                          basis: ai_only
                          vote_shares: null
                        ai:
                          status: possible
                          source: dish_name_inference
                          evidence: Soba noodles are usually made with buckwheat.
                        store_history: null
                    dietary_restrictions:
                      - dietary_restriction_id: 4
                        display_name: No alcohol
                        prediction:
                          status: possible
                          basis: ai_only
                          vote_shares: null
                        ai:
                          status: possible_conflict
                          source: recipe_inference
                          evidence: The broth seasoning may use cooking sake.
                        store_history: null
          headers:
            Cache-Control:
              $ref: "#/components/headers/no_store"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/not_found"
        "413":
          $ref: "#/components/responses/image_too_large"
        "415":
          $ref: "#/components/responses/unsupported_image_type"
        "422":
          $ref: "#/components/responses/validation_error"
        "429":
