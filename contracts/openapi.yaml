  /menus/{menu_id}/confirmations:
    post:
      operationId: create_confirmation
      summary: 店員回答・公開可否の一括保存
      description: 両回答配列と店員の公開同意を1回のRPCで原子的に保存する。利用者同意は解析時のスナップショットを使う。店舗あり・利用者同意・今回の店員同意がすべてtrueの場合だけ公開。他の確認の同意で今回の回答を公開しない。非公開でも同店舗の予測には集計利用し、店舗未選択は公開・再利用とも不可。同一request_idと同一内容は200、違う内容は409。新規確認は最大5回で、再送判定は上限判定より先。期限切れは再送も410。
      tags:
        - P0
      x-api-number: 6
      x-priority: P0
      security:
        - analysis_bearer: []
      parameters:
        - $ref: "#/components/parameters/menu_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/confirmation_request"
            example:
              request_id: 66666666-6666-4666-8666-666666666666
              answers:
                - dish_id: 33333333-3333-4333-8333-333333333331
                  allergen_id: 4
                  answer: contains
                - dish_id: 33333333-3333-4333-8333-333333333331
                  allergen_id: 6
                  answer: cross_contact
              dietary_answers:
                - dish_id: 33333333-3333-4333-8333-333333333331
                  dietary_restriction_id: 4
                  answer: unknown
              publish_consent: true
              locale: en
      responses:
        "200":
          description: 同一request_id・同一回答・同一の店員同意を再送。行は増えずreplayed=true。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/confirmation_replayed_response"
              example:
                session_id: 44444444-4444-4444-8444-444444444444
                confirmed_at: 2026-10-17T03:10:00Z
                publish_consent: true
                user_publish_consent: true
                is_public: true
                replayed: true
                results:
                  - dish_id: 33333333-3333-4333-8333-333333333331
                    display_name: Shrimp tempura soba
                    allergens:
                      - allergen_id: 4
                        display_name: Shrimp
                        answer: contains
                        answer_label: Contains
                        ai:
                          status: explicit_present
                          source: menu_text
                          evidence: 海老天
                      - allergen_id: 6
                        display_name: Buckwheat
                        answer: cross_contact
                        answer_label: Cross-contact (not an ingredient, but cooked with shared equipment)
                        ai:
                          status: possible
                          source: dish_name_inference
                          evidence: Soba noodles are usually made with buckwheat.
                    dietary_restrictions:
                      - dietary_restriction_id: 4
                        display_name: No alcohol
                        answer: unknown
                        answer_label: Unknown
                        ai:
                          status: possible_conflict
                          source: recipe_inference
                          evidence: The broth seasoning may use cooking sake.
          headers:
            Cache-Control:
              $ref: "#/components/headers/no_store"
        "201":
          description: 作成成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/confirmation_created_response"
              example:
