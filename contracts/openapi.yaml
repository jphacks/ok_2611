# Source of truth: docs/api.md. Design contract; runtime behavior is not verified.
openapi: 3.1.0
info:
  title: Meelyze+ API
  version: 0.1.0-draft
  description: docs/api.mdを正本として作成した設計契約。アプリ・DB・外部サービスの実装や動作確認を示すものではない。JSON名はsnake_case。未定義入力は422。日時はUTC。AIの予測と未認証の店員回答を区別し、安全性・認証を保証しない。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: API_ORIGINからの相対URL。本番のホストは未指定。
tags:
  - name: P0
    description: 必須7操作。優先して契約を検証する。
  - name: P1
    description: P0完成後に追加する10操作。
security: []
x-source: ../docs/api.md
x-specification-notes:
  - レスポンス例のフィールドは原則requiredとした。price・店舗未選択のgoogle_place_id・store_history・vote_shares・next_cursorはnullを許可。例だけの項目の省略可否は未指定。
  - 不明AIのevidenceは型・空値が明記されていない。全AI variantで文字列（空文字可）として暫定定義し、null・欠落は許可しない。
  - 料理名200文字、Place ID255文字、priceの範囲・桁、currencyの3文字は、APIから参照するDB仕様で補足した。
  - API 6のlocaleは共通の既定enに従い任意と解釈した。GETでのallergen_ids省略時の対象と空クエリ文字列の扱いは詳細に未指定。
  - API 9のパスワード長、cursorの書式・最大長、公開集計の料理数上限・ページングは未指定。値・上限・追加パラメータを創作していない。
  - エラーcode一覧は主な値であり網羅enumとは書かれていない。文字列とsnake_caseパターン・列挙済みexamplesで定義した。共通SQLSTATE変換に基づく404と共通入力検証422を該当操作に含めた。
  - 画素数超過時のHTTPコード、画像破損と非対応形式の区別は未指定。画像のバイト数・画素数を拡張属性と説明で記録し、サーバーでの検証を必須とした。
  - 登録のemail・nicknameは正規化後の制約。OpenAPI自体は空白除去や小文字化を実行しないため、処理順はサーバー実装で揃える。
  - DB・画面で使う原材料候補ingredientsはAPIのレスポンスに定義がないため追加していない。生のVLM JSON Schemaは本契約の対象外。
  - 同一request_idの保存内容にはlocaleを含めないと解釈（RPC引数にlocaleがない）。合計回答数・直積・所有者・公開条件・冪等性・票計算はサーバー検証が必要。
